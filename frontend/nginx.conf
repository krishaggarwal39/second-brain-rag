# HSTS is only meaningful over HTTPS. When TLS is terminated in front of nginx
# (e.g. the optional Caddy service), the proxy sets X-Forwarded-Proto: https.
map $http_x_forwarded_proto $hsts_header {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 8080;
    server_name localhost;

    # Restore the real client IP only when the request comes from a trusted TLS proxy.
    # REAL_IP_FROM defaults to 127.0.0.1/32 (effectively off).
    set_real_ip_from ${REAL_IP_FROM};
    real_ip_header X-Forwarded-For;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # connect-src 'self' covers SSE (/api/chat/stream). Google Fonts (Inter) is allowed explicitly.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security $hsts_header always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Re-resolve the backend through Docker's DNS. A literal upstream is resolved
    # once at startup, so recreating the backend container (new IP) caused 502s
    # until nginx restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    location /api/ {
        # The app accepts uploads up to 10 MB; leave headroom for multipart overhead.
        client_max_body_size 12m;

        # Strip the /api prefix before forwarding (a variable proxy_pass does not
        # replace the location prefix by itself).
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (never append) so clients cannot inject their own X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Inject the server-side API key; the key never reaches the browser JS bundle.
        proxy_set_header X-API-Key ${API_KEY};

        # SSE / streaming: disable all buffering so tokens arrive in real-time.
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long timeouts for AI generation (up to 5 minutes).
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
