name: CI & Evaluation Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CHROMA_TEST_TOKEN: ci-chroma-token-0123456789

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: second_brain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      chroma:
        # Same server version as the compose stacks (the backend ships the HTTP-only client).
        image: chromadb/chroma:0.5.23
        env:
          IS_PERSISTENT: "FALSE"
          ANONYMIZED_TELEMETRY: "FALSE"
          CHROMA_SERVER_AUTHN_PROVIDER: chromadb.auth.token_authn.TokenAuthenticationServerProvider
          CHROMA_SERVER_AUTHN_CREDENTIALS: ci-chroma-token-0123456789
          CHROMA_AUTH_TOKEN_TRANSPORT_HEADER: Authorization
        ports:
          - 8000:8000
        # Jobs wait for a healthy service before the first step runs.
        options: >-
          --health-cmd "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=4)\""
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install system deps (libmagic for python-magic)
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install dependencies
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements-dev.txt

      - name: Run linter
        run: ruff check .
        working-directory: backend

      - name: Run backend tests with coverage gate
        env:
          API_KEY: test-api-key-12345
          API_KEYS: test-api-key-12345,second-key-67890
          GOOGLE_API_KEY: fake-key
          GROQ_API_KEY: fake-key
          CACHE_BACKEND: memory
          OTEL_ENABLED: "false"
          JWT_SECRET: ci-test-jwt-secret-key-not-for-production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/second_brain_test
          CHROMA_TEST_HOST: localhost
          CHROMA_TEST_PORT: "8000"
        run: pytest --tb=short -q --cov --cov-config=.coveragerc --cov-report=term-missing --cov-report=xml
        working-directory: backend

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Unit tests (includes the backend contract test)
        run: npm test
        working-directory: frontend

      - name: Production build
        run: npx vite build
        working-directory: frontend

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        working-directory: frontend

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report/

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Audit Python dependencies (full resolution, all transitive packages)
        run: |
          pip install uv==0.11.26 pip-audit==2.10.1
          uv pip compile backend/requirements.txt --python-version 3.11 --python-platform linux \
            -o /tmp/requirements.lock
          pip-audit -r /tmp/requirements.lock --no-deps --disable-pip --strict

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Audit npm dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
        working-directory: frontend

  compose-and-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate compose files
        run: |
          printf '%s\n' API_KEY=x-ci-0123456789 JWT_SECRET=ci-jwt-secret-0123456789 \
            CHROMA_AUTH_TOKEN=x REDIS_PASSWORD=x NEO4J_PASSWORD=x POSTGRES_PASSWORD=x > .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q
          # A missing secret must fail loudly instead of using a default.
          grep -v '^POSTGRES_PASSWORD' .env > .env.missing
          if docker compose -f docker-compose.prod.yml --env-file .env.missing config -q 2>/dev/null; then
            echo "prod compose accepted a missing secret" && exit 1
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  retrieval-eval:
    # Keyword-overlap retrieval evaluation (custom_eval.py), not the ragas library.
    runs-on: ubuntu-latest
    needs: backend-tests
    services:
      chroma:
        image: chromadb/chroma:0.5.23
        env:
          IS_PERSISTENT: "FALSE"
          ANONYMIZED_TELEMETRY: "FALSE"
          CHROMA_SERVER_AUTHN_PROVIDER: chromadb.auth.token_authn.TokenAuthenticationServerProvider
          CHROMA_SERVER_AUTHN_CREDENTIALS: ci-chroma-token-0123456789
          CHROMA_AUTH_TOKEN_TRANSPORT_HEADER: Authorization
        ports:
          - 8000:8000
        # Jobs wait for a healthy service before the first step runs.
        options: >-
          --health-cmd "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=4)\""
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CACHE_BACKEND: memory
      OTEL_ENABLED: "false"
      CHROMA_HOST: localhost
      CHROMA_PORT: "8000"
      CHROMA_AUTH_TOKEN: ci-chroma-token-0123456789
      EVAL_OWNER_ID: eval-owner
      JWT_SECRET: ci-test-jwt-secret-key-not-for-production
      API_KEY: ci-eval-key-123456
      GOOGLE_API_KEY: fake-key
      GROQ_API_KEY: fake-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            evaluation/requirements.txt

      - name: Install dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.txt
          pip install -r evaluation/requirements.txt

      - name: Generate test documents
        run: python evaluation/generate_test_docs.py

      - name: Ingest test documents (owner-scoped)
        run: python evaluation/ingest_test_docs.py

      - name: Run retrieval evaluation (fails on off-topic leakage too)
        env:
          RAGAS_MIN_RECALL: "0.70"
          RAGAS_MIN_PRECISION: "0.60"
        run: python evaluation/custom_eval.py

      - name: Answer-quality harness smoke test (fakes; no LLM calls)
        run: python evaluation/answer_eval.py --dry-run --limit 5

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: retrieval-evaluation-report
          path: evaluation/reports/
