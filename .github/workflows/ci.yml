name: CI & Evaluation Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (libmagic for python-magic)
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install dependencies
        run: |
          pip install -r backend/requirements-dev.txt
          pip install "bcrypt==4.0.1"

      - name: Run linter
        run: ruff check backend/app/
        working-directory: backend

      - name: Run backend tests with coverage gate
        env:
          API_KEY: test-api-key-12345
          API_KEYS: test-api-key-12345,second-key-67890
          GOOGLE_API_KEY: fake-key
          GROQ_API_KEY: fake-key
          CACHE_BACKEND: memory
          OTEL_ENABLED: "false"
          JWT_SECRET: ci-test-jwt-secret-key-not-for-production
          JWT_EXPIRY_MINUTES: "1440"
        run: pytest --tb=short -q --cov --cov-config=.coveragerc --cov-report=term-missing --cov-report=xml
        working-directory: backend

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend unit tests
        run: npm test
        working-directory: frontend

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        working-directory: frontend

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

  ragas-eval:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r evaluation/requirements.txt

      - name: Generate test documents
        run: python evaluation/generate_test_docs.py

      - name: Ingest test documents
        env:
          CACHE_BACKEND: memory
          OTEL_ENABLED: "false"
        run: python evaluation/ingest_test_docs.py

      - name: Run RAG evaluation
        env:
          CACHE_BACKEND: memory
          OTEL_ENABLED: "false"
          RAGAS_MIN_RECALL: "0.70"
          RAGAS_MIN_PRECISION: "0.60"
        run: python evaluation/custom_eval.py

      - name: Upload Evaluation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-report
          path: evaluation/reports/
